[package]
name = "boxcad-cli"
description = "Command-line access to Box CAD's core, for tests and sweeps."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "boxcad-cli"
path = "src/main.rs"

[dependencies]
boxcad-core = { path = "../boxcad-core" }
clap = { version = "4", features = ["derive"] }
